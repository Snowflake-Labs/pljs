name: 🚀 Release on PGXN
on:
  push:
    # Release on semantic version tag.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
jobs:
  release:
    name: Release on PGXN
    # Only plv8/pljs publishes pljs to PGXN.  On a fork this job would attempt a
    # real release from our tag and fail for want of PGXN credentials, so gate it
    # on the repository rather than deleting the file (keeping the diff against
    # upstream minimal).
    if: github.repository == 'plv8/pljs'
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools
    steps:
    - name: Check out the repo
      uses: actions/checkout@v4
    - name: Bundle the Release
      env: { GIT_ARCHIVE_CMD: archive-all }
      run: pgxn-bundle
    - name: Release on PGXN
      env:
        PGXN_USERNAME: ${{ secrets.PGXN_USERNAME }}
        PGXN_PASSWORD: ${{ secrets.PGXN_PASSWORD }}
      run: pgxn-release
